<!DOCTYPE html>
<html>
<head>
 <title>Change Background Colour</title>
</head>
<body>
<h2>Click the button to change background colour</h2>
<button onclick="changeColor()">Change Colour</button>
<script>
function changeColor() {
 document.body.style.backgroundColor = "lightblue";
}
</script>
</body>
</html>
